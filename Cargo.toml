[workspace]
resolver = "3"
members = [
  "crates/vy-api-schema",
  "crates/vy-app",
  "crates/vy-capabilities",
  "crates/vy-core",
  "crates/vy-js",
  "crates/vy-proto",
  "crates/vy-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/nazo6/vy"
license = "Apache-2.0"

[workspace.dependencies]
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
# Protocol
serde = { version = "1", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"

# Core
ropey = "1"

# Client
async-channel = "2"
dirs = "5"
serde_json = "1"
# TypeScript types for the plugin API
ts-rs = "12"

# Server
tokio = {
  version = "1",
  features = [
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
  ]
}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Client
# Pin the version exactly, per ADR 0001.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-base = "0.8.0"
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9" }

vy-api-schema = { path = "crates/vy-api-schema" }
vy-capabilities = { path = "crates/vy-capabilities" }
vy-core = { path = "crates/vy-core" }
vy-js = { path = "crates/vy-js" }
vy-proto = { path = "crates/vy-proto" }

# Without optimization, GPUI and wgpu take tens of milliseconds per frame and key
# input stutters. Optimize dependencies only and keep debug info for our crates
# (the same setup Zed uses). The first build is slower because dependencies rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
