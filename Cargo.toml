[workspace]
resolver = "3"
members = [
  "crates/vy-app",
  "crates/vy-core",
  "crates/vy-proto",
  "crates/vy-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/nazo6/vy"
license = "Apache-2.0"

[workspace.dependencies]
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
# Protocol
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Core
ropey = "1"

# Client
dirs = "5"
serde_json = "1"

# Server
tokio = {
  version = "1",
  features = [
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
  ]
}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Client
# Pin the version exactly, per ADR 0001.
gpui = "=0.2.2"

vy-core = { path = "crates/vy-core" }
vy-proto = { path = "crates/vy-proto" }

# xattr 0.2.3, pulled in by gpui 0.2.2, references libc::ENOATTR, which does not exist
# on Linux, and fails to build. Until upstream fixes it, use the copy in vendor/ with
# a local patch.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

# Without optimization, GPUI and wgpu take tens of milliseconds per frame and key
# input stutters. Optimize dependencies only and keep debug info for our crates
# (the same setup Zed uses). The first build is slower because dependencies rebuild.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
