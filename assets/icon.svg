<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background rounded squircle / gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0f0f12"/>
    </linearGradient>

    <!-- Main 'V' gradient (Electric Cyan to Royal Blue) -->
    <linearGradient id="vGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Right wing gradient (Indigo to Violet accent) -->
    <linearGradient id="vGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Caret / Terminal cursor accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="#27272a" stroke-width="4" filter="url(#shadow)"/>

  <!-- Inner subtle grid / editor line accent -->
  <path d="M 96 160 L 416 160" stroke="#27272a" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <path d="M 96 256 L 416 256" stroke="#27272a" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>
  <path d="M 96 352 L 416 352" stroke="#27272a" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Vy 'V' Glyph -->
  <g filter="url(#glow)">
    <!-- Left stroke of V -->
    <path d="M 144 140 L 220 140 L 256 320 L 210 320 Z" fill="url(#vGradLeft)" />

    <!-- Right stroke of V with overlap -->
    <path d="M 368 140 L 292 140 L 236 376 L 276 376 Z" fill="url(#vGradRight)" />

    <!-- Terminal cursor block / caret accent at bottom right -->
    <rect x="300" y="324" width="44" height="24" rx="6" fill="url(#accentGrad)" opacity="0.9" />
  </g>
</svg>

