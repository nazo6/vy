[package]
name = "vy-app"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
async-channel.workspace = true
dirs.workspace = true
gpui.workspace = true
gpui-base.workspace = true
rmp-serde.workspace = true
rmpv.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
ts-rs.workspace = true
vy-api-schema.workspace = true
vy-capabilities.workspace = true
vy-core.workspace = true
vy-host-api.workspace = true
vy-js.workspace = true
vy-proto.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui-platform = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
gpui-platform = { workspace = true, features = ["font-kit"] }
